<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Control Panel Pro (8 Slots)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #050505; color: #fff; overflow-x: hidden; min-height: 100vh;
        }
        .control-panel {
            width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; 
            background: #0f172a; overflow-y: auto; border: 2px solid #334155;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; font-size: 1.2rem; color: #38bdf8; }
        .form-group { margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #94a3b8; }
        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%; padding: 10px; background: #020617;
            border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; margin-bottom: 8px; outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        .btn-action {
            background: #ef4444; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.85rem;
            transition: opacity 0.2s; margin-top: 5px;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-play { background: #10b981; }
        .btn-host { background: #8b5cf6; }
        .btn-icon-only { background: #f59e0b; }
        .target-card-inline {
            display: none; align-items: center; gap: 10px; margin-top: 5px; margin-bottom: 8px;
            background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #475569;
        }
        .target-card-inline.show { display: flex; }
        .preview-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid #38bdf8; flex-shrink: 0;
        }
        .target-info-inline { flex: 1; min-width: 0; }
        .target-name-inline { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .target-username-inline { font-size: 11px; color: #38bdf8; }
        .status-msg { font-size: 11px; color: #94a3b8; margin-bottom: 5px; min-height: 16px; }
        .status-msg.loading { color: #facc15; }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #f87171; }

        .gift-preview-card {
            display: flex; align-items: center; gap: 10px; margin-top: 5px; margin-bottom: 8px;
            background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #475569;
        }
        .gift-preview-card img {
            width: 44px; height: 44px; object-fit: contain;
            border: 2px solid #facc15; border-radius: 8px; background: #020617; flex-shrink: 0;
        }
        .gift-name-preview { font-size: 13px; font-weight: bold; color: #fff; }
        .gift-points-preview { font-size: 11px; color: #facc15; }
        .calc-box {
            background: #020617; border: 1px dashed #475569; border-radius: 6px;
            padding: 8px; font-size: 11px; color: #94a3b8; margin-top: 5px; line-height: 1.7;
        }
        .calc-box b { color: #4ade80; }
        .sub-section {
            margin-top: 12px; padding-top: 10px; border-top: 1px dashed #475569;
        }
        .qty-row { display: flex; align-items: center; gap: 8px; }
        .qty-row input { width: 80px; margin-bottom: 0; }
        .qty-row span { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>Control Panel (Pro System - 8 Slots)</h2>
        
        <!-- Upload Video Khusus Host -->
        <div class="form-group" style="border-color: #8b5cf6;">
            <label for="hostVideoFile" style="color: #c4b5fd;">Upload Video Khusus Host:</label>
            <input type="file" id="hostVideoFile" accept="video/*">
            <button class="btn-action btn-host" onclick="playHostVideo()">Putar Video Host (Layar Utama)</button>
        </div>

        <!-- Video Animasi Gift + Pilih Nama Gift -->
        <div class="form-group" style="border-color: #10b981;">
            <label for="gsVideoFile" style="color: #34d399;">1. Upload Video Animasi Gift (Opsional):</label>
            <input type="file" id="gsVideoFile" accept="video/*">
            <div id="gsFileInfo" class="status-msg">Contoh nama file: gift_6.00K.mp4 (angka = pengali poin)</div>

            <label style="margin-top:10px; color: #34d399;">2. Pilih Nama Gift (Icon + Poin):</label>
            <select id="giftSelect"></select>

            <div class="gift-preview-card">
                <img id="giftPreviewIcon" src="" alt="icon gift">
                <div>
                    <div id="giftPreviewName" class="gift-name-preview">-</div>
                    <div id="giftPreviewPoints" class="gift-points-preview">-</div>
                </div>
            </div>

            <div class="calc-box" id="calcBox"></div>

            <button class="btn-action btn-play" onclick="playGreenScreenVideo()" style="margin-top:10px;">▶ Putar Video + Tampilkan Icon ke Slot Target</button>

            <!-- OPSI: TANPA VIDEO ANIMASI -->
            <div class="sub-section">
                <label style="color: #fbbf24;">3. Tanpa Video Animasi (Icon Saja):</label>
                <div class="qty-row">
                    <input type="number" id="iconOnlyQty" value="1" min="1" step="1">
                    <span>× jumlah gift (dikali poin gift)</span>
                </div>
                <button class="btn-action btn-icon-only" onclick="showGiftIconOnly()">★ Tampilkan Icon Gift Saja ke Slot Target (5 Detik)</button>
            </div>
        </div>

        <!-- Input Target Permintaan / Slot -->
        <div class="form-group">
            <label for="targetSlot">Pilih Slot Target (Kotak 1 - 8):</label>
            <select id="targetSlot">
                <option value="1">Kotak 1 (Kiri Atas)</option>
                <option value="2">Kotak 2 (Kiri)</option>
                <option value="3">Kotak 3 (Kiri)</option>
                <option value="4">Kotak 4 (Kiri Bawah)</option>
                <option value="5">Kotak 5 (Kanan Atas)</option>
                <option value="6">Kotak 6 (Kanan)</option>
                <option value="7">Kotak 7 (Kanan)</option>
                <option value="8">Kotak 8 (Kanan Bawah)</option>
            </select>

            <label style="margin-top:10px;">Username / Link TikTok Target:</label>
            <input type="text" placeholder="Contoh: username atau link TikTok..." id="targetInput">
            
            <div id="targetCardInline" class="target-card-inline">
                <img id="previewImg" class="preview-img" alt="Avatar">
                <div class="target-info-inline">
                    <div id="targetName" class="target-name-inline">-</div>
                    <div id="targetUsername" class="target-username-inline">-</div>
                </div>
            </div>
            <div id="statusMsg" class="status-msg">Siap</div>

            <button class="btn-action" id="btnInstall" onclick="installTarget()" style="background:#3b82f6; margin-top:8px;" disabled>Pasang ke Display</button>
            <button class="btn-action" onclick="clearTarget()" style="background:#64748b; margin-top:8px;">Reset / Kosongkan Slot Ini</button>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        /* ======================= DAFTAR GIFT (8 TOTAL) =======================
           Tambah gift baru cukup tambah baris di sini:
           { name: "Nama Gift", points: JUMLAH_POIN, icon: "URL_ICON" }        */
        const GIFT_LIST = [
            {
                name: "Yuki's Vigilance",
                points: 42999,
                icon: "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/ce72697aca20b8741b1d5bff2035db78.png~tplv-obj.webp"
            },
            {
                name: "Rin the Snowborn",
                points: 25999,
                icon: "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/242b68f7c08a95d710e3062a2647c027.png~tplv-obj.webp"
            },
            {
                name: "Lord Marcellus",
                points: 42999,
                icon: "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/41502579bacbbf9f31f43b7c7582cb26.png~tplv-obj.webp"
            },
            {
                name: "Doughnut",
                points: 30,
                icon: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp"
            },
            {
                name: "Mawar",
                points: 1,
                icon: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp"
            },
            {
                name: "Jari Hati",
                points: 5,
                icon: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp"
            },
            {
                name: "Topi Koboi",
                points: 99,
                icon: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/2f1e4f3f5c728ffbfa35705b480fdc92~tplv-obj.webp"
            },
            {
                name: "Kalung Emas",
                points: 200,
                icon: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/21549ba24f76a01d00373cb8e35660ae.png~tplv-obj.webp"
            }
        ];
        /* ==================================================================== */

        let gsVideoUrl = '';
        let hostVideoUrl = '';
        let pendingTargetData = { username: '', name: '', photo: '' };
        let currentMultiplier = 0;

        const giftSelect = document.getElementById('giftSelect');
        const giftPreviewIcon = document.getElementById('giftPreviewIcon');
        const giftPreviewName = document.getElementById('giftPreviewName');
        const giftPreviewPoints = document.getElementById('giftPreviewPoints');
        const calcBox = document.getElementById('calcBox');
        const gsFileInfo = document.getElementById('gsFileInfo');
        const iconOnlyQty = document.getElementById('iconOnlyQty');

        GIFT_LIST.forEach((g, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${g.name}  (${formatPointsShort(g.points)} poin)`;
            giftSelect.appendChild(opt);
        });

        function updateGiftPreview() {
            const g = GIFT_LIST[giftSelect.value] || GIFT_LIST[0];
            giftPreviewIcon.src = g.icon;
            giftPreviewName.innerText = g.name;
            giftPreviewPoints.innerText = `${g.points.toLocaleString('id-ID')} poin / gift`;
            updateCalcBox();
        }
        giftSelect.addEventListener('change', updateGiftPreview);
        iconOnlyQty.addEventListener('input', updateCalcBox);
        updateGiftPreview();

        /* Deteksi pengali dari NAMA FILE video: "gift_6.00K.mp4" -> 6.00 */
        function parseMultiplierFromFilename(filename) {
            if (!filename) return 0;
            const match = filename.match(/(\d+(?:[.,]\d+)?)/);
            if (!match) return 0;
            const val = parseFloat(match[1].replace(',', '.'));
            return isNaN(val) ? 0 : val;
        }

        function formatPointsShort(num) {
            if (num >= 1_000_000) return trimZeros((num / 1_000_000).toFixed(2)) + 'M';
            if (num >= 1000) return trimZeros((num / 1000).toFixed(2)) + 'K';
            return num.toString();
        }
        function trimZeros(s) { return s.replace(/\.?0+$/, ''); }

        function updateCalcBox() {
            const g = GIFT_LIST[giftSelect.value] || GIFT_LIST[0];
            const qty = Math.max(1, parseInt(iconOnlyQty.value) || 1);
            const iconTotal = qty * g.points;

            let html = `<b>Mode Icon Saja:</b> ${qty} × ${g.points.toLocaleString('id-ID')} = ` +
                       `<b>${iconTotal.toLocaleString('id-ID')}</b> (${formatPointsShort(iconTotal)})`;

            if (currentMultiplier) {
                const videoTotal = Math.round(currentMultiplier * g.points);
                html += `<br><b>Mode Video:</b> ${currentMultiplier} × ${g.points.toLocaleString('id-ID')} = ` +
                        `<b>${videoTotal.toLocaleString('id-ID')}</b> (${formatPointsShort(videoTotal)})`;
            } else {
                html += `<br><b>Mode Video:</b> belum ada video / nama file tanpa angka`;
            }
            calcBox.innerHTML = html;
        }

        document.getElementById('gsVideoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            gsVideoUrl = URL.createObjectURL(file);
            currentMultiplier = parseMultiplierFromFilename(file.name);
            gsFileInfo.innerText = `Video: ${file.name} (pengali: ${currentMultiplier || '-'})`;
            gsFileInfo.className = 'status-msg success';
            updateCalcBox();
        });

        /* MODE 1: Video animasi + icon + poin */
        function playGreenScreenVideo() {
            if (!gsVideoUrl) return alert('Upload video animasi gift dulu! (Atau pakai "Icon Saja")');
            const slotId = document.getElementById('targetSlot').value;
            const gift = GIFT_LIST[giftSelect.value] || GIFT_LIST[0];

            channel.postMessage({
                type: 'UPDATE_GS_VIDEO',
                url: gsVideoUrl,
                data: {
                    slot: slotId,
                    giftName: gift.name,
                    giftIcon: gift.icon,
                    giftPoints: gift.points,
                    multiplier: currentMultiplier,
                    addPoints: Math.round(currentMultiplier * gift.points)
                }
            });
        }

        /* MODE 2: Icon SAJA tanpa video animasi */
        function showGiftIconOnly() {
            const slotId = document.getElementById('targetSlot').value;
            const gift = GIFT_LIST[giftSelect.value] || GIFT_LIST[0];
            const qty = Math.max(1, parseInt(iconOnlyQty.value) || 1);

            channel.postMessage({
                type: 'UPDATE_GIFT_ICON',
                data: {
                    slot: slotId,
                    giftName: gift.name,
                    giftIcon: gift.icon,
                    giftPoints: gift.points,
                    multiplier: qty,
                    addPoints: qty * gift.points
                }
            });
        }

        function playHostVideo() {
            if (!hostVideoUrl) return alert('Pilih file video host terlebih dahulu!');
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: hostVideoUrl });
        }
        document.getElementById('hostVideoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) hostVideoUrl = URL.createObjectURL(file);
        });

        /* ---------- Target slot (nama TikTok dari API) ---------- */
        function normalize(v) {
            let s = String(v || "").trim();
            s = s.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, "");
            s = s.replace(/^@/, "");
            return s.split(/[/?#]/)[0].trim();
        }
        function pick(obj, keys, fb) {
            for (const k of keys) {
                let v = obj;
                for (const p of k.split(".")) v = v?.[p];
                if (v !== undefined && v !== null && v !== "") return v;
            }
            return fb;
        }
        function extractUser(raw) {
            if (!raw || typeof raw !== "object") throw new Error("Response Kosong");
            if (raw.code !== undefined && Number(raw.code) !== 0) {
                throw new Error(raw.msg || "Akun tidak ditemukan");
            }
            const root = raw.data || raw;
            const info = root.userInfo || root.user_info || {};
            const user = info.user || root.user || info || root;
            const username = String(pick(user, ["uniqueId", "unique_id", "username"], "")).replace(/^@/, "").trim();
            if (!username) throw new Error("Username tidak ditemukan di data");
            return {
                username,
                name: String(pick(user, ["nickname", "name", "display_name"], username)),
                avatar: String(pick(user, ["avatarLarger", "avatarMedium", "avatarThumb", "avatar", "avatar_url"], ""))
            };
        }
        async function requestTikwmUser(username) {
            const res = await fetch("https://www.tikwm.com/api/user/info/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                body: "unique_id=" + encodeURIComponent(username)
            });
            if (!res.ok) throw new Error("Gagal koneksi ke server");
            return extractUser(await res.json());
        }

        const targetInput = document.getElementById('targetInput');
        const statusMsg = document.getElementById('statusMsg');
        const previewImg = document.getElementById('previewImg');
        const targetCardInline = document.getElementById('targetCardInline');
        const targetName = document.getElementById('targetName');
        const targetUsername = document.getElementById('targetUsername');
        const btnInstall = document.getElementById('btnInstall');

        let timeout = null;
        targetInput.addEventListener('input', () => {
            btnInstall.innerText = "Cek...";
            btnInstall.disabled = true;
            clearTimeout(timeout);
            timeout = setTimeout(() => { stageProfile(); }, 800);
        });

        async function stageProfile() {
            let inputVal = targetInput.value.trim();
            if (!inputVal) {
                targetCardInline.classList.remove('show');
                statusMsg.innerText = 'Siap';
                statusMsg.className = 'status-msg';
                pendingTargetData = { username: '', name: '', photo: '' };
                btnInstall.innerText = "Pasang ke Display";
                btnInstall.disabled = true;
                return;
            }

            let cleanUsername = normalize(inputVal);
            statusMsg.innerText = 'Mendeteksi...';
            statusMsg.className = 'status-msg loading';
            targetCardInline.classList.add('show');

            let currentPhoto = `https://ui-avatars.com/api/?name=${encodeURIComponent(cleanUsername)}&background=random&size=128`;
            previewImg.src = currentPhoto;
            targetName.innerText = cleanUsername;
            targetUsername.innerText = '@' + cleanUsername;

            try {
                const data = await requestTikwmUser(cleanUsername);
                pendingTargetData = { username: '@' + data.username, name: data.name, photo: data.avatar };
                previewImg.src = data.avatar;
                targetName.innerText = data.name;
                targetUsername.innerText = '@' + data.username;
                statusMsg.innerText = "Terdeteksi! Nama TikTok: " + data.name;
                statusMsg.className = 'status-msg success';
                btnInstall.innerText = "Pasang ke Display";
                btnInstall.disabled = false;
            } catch (error) {
                statusMsg.innerText = "Akun tidak terdeteksi. Menggunakan input manual.";
                statusMsg.className = 'status-msg error';
                btnInstall.innerText = "Pasang ke Display";
                btnInstall.disabled = false;
                pendingTargetData = { username: '@' + cleanUsername, name: cleanUsername, photo: currentPhoto };
            }
        }

        function installTarget() {
            if (!pendingTargetData.name) return;
            const slotId = document.getElementById('targetSlot').value;
            channel.postMessage({
                type: 'UPDATE_TARGET_SLOT',
                data: {
                    slot: slotId,
                    name: pendingTargetData.name,
                    nickname: pendingTargetData.name,
                    username: pendingTargetData.username,
                    photo: pendingTargetData.photo,
                    clear: false
                }
            });
            targetInput.value = '';
            targetCardInline.classList.remove('show');
            statusMsg.innerText = `Kotak ${slotId} Berhasil Dipasang!`;
            statusMsg.className = 'status-msg success';
            btnInstall.innerText = "Pasang ke Display";
            btnInstall.disabled = true;
            pendingTargetData = { username: '', name: '', photo: '' };
        }

        function clearTarget() {
            const slotId = document.getElementById('targetSlot').value;
            targetInput.value = '';
            targetCardInline.classList.remove('show');
            statusMsg.innerText = 'Siap';
            statusMsg.className = 'status-msg';
            btnInstall.innerText = "Pasang ke Display";
            btnInstall.disabled = true;
            pendingTargetData = { username: '', name: '', photo: '' };
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: { slot: slotId, clear: true } });
        }
    </script>
</body>
</html>
