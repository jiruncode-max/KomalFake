<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Display Studio (9:16)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
        }

        .wrapper-9-16 {
            width: 405px;
            height: 720px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            padding: 0px; 
            border: 1px solid #222;
            overflow: hidden;
            border-radius: 0px;
        }

        /* VIDIO HOST: FULL SCREEN (latar belakang) */
        .host-video-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
            transform: translateZ(0);
        }

        .main-container {
            position: absolute;
            top: 0; left: 0;
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            width: 100%; 
            padding: 8px 16px 0 16px; 
            z-index: 30;
            pointer-events: none;
        }

        .side-column { display: flex; flex-direction: column; gap: 8px; width: 92px; }

        .box {
            width: 92px; 
            height: 92px; 
            border-radius: 12px !important; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: rgba(22, 22, 22, 0.9);
            position: relative; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 0 0px #1890ff;
            transition: background-color 0.3s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            pointer-events: auto;
        }
        
        .box.active-slot { background-color: rgba(90, 90, 90, 0.85); }

        .box .plus { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px; font-weight: 700; color: #b0b0b0; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.8); line-height: 0.7;
            transform: scaleY(1.3); display: inline-block;
        }

        .box .label { 
            font-family: Arial, sans-serif;
            font-size: 7px; font-weight: 400; color: #b0b0b0;
            margin-top: 5px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); 
        }

        .slot-star-number-group {
            position: absolute; top: 4px; left: 4px;
            z-index: 10; height: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            display: none; align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            overflow: hidden; padding-right: 3px;
        }

        .slot-star-circle-small {
            width: 7px; height: 7px;
            background-color: #1890ff; border: 1px solid #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin-left: 2px;
        }

        .slot-star-circle-small .star-icon { font-size: 5px; color: #ffffff; line-height: 1; }
        .slot-number-text { padding: 0 2px; color: #ffffff; font-size: 6px; font-weight: bold; line-height: 1; }

        .slot-top-right-icon {
            position: absolute; top: 4px; right: 4px;
            z-index: 15; width: 18px; height: 18px;
            display: none; align-items: center; justify-content: center;
            pointer-events: none; border-radius: 3px; overflow: hidden; background: transparent;
        }
        .slot-top-right-icon img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
        }

        .slot-footer-bar {
            position: absolute; bottom: 4px; left: 4px; right: 4px;
            z-index: 10; display: flex; align-items: center; justify-content: space-between;
            pointer-events: none;
        }

        .slot-name-bottom {
            color: #ffffff; font-size: 6px; 
            display: flex; align-items: center; gap: 2px; max-width: calc(100% - 12px);
        }
        
        .slot-name-bottom .name-text { 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
            font-weight: 500; letter-spacing: 0.2px;
        }
        
        .slot-name-bottom .plus-circle-icon {
            width: 9px; height: 9px; background-color: #666666;
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-size: 5px; font-weight: bold; line-height: 1; flex-shrink: 0;
        }

        .mic-icon-bottom-right { display: none; align-items: center; justify-content: center; flex-shrink: 0; }
        .mic-icon-bottom-right svg { width: 8px; height: 8px; fill: #ffffff; }

        /* VIDIO ANIMASI: FULL SCREEN (lapisan di atas host) */
        .anim-area {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 20;
            display: none;
            pointer-events: none;
        }

        /* Mode tanpa keying: tampil utuh apa adanya, kualitas native penuh */
        .anim-video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            transform: translateZ(0);
        }

        /* Canvas keying: dirender pada RESOLUSI ASLI vidio -> tajam HD */
        .anim-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            transform: translateZ(0);
        }

        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
        }
        
        .avatar-container { position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
        .slot-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; position: relative; z-index: 2; }

        .avatar-container.pulsing::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); z-index: 1;
            animation: whiteRippleSingle 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; opacity: 0;
        }

        @keyframes whiteRippleSingle {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            100% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body>

    <div class="wrapper-9-16">
        <!-- VIDIO HOST: full screen, latar belakang -->
        <video class="host-video-layer" id="hostVideoLayer" playsinline loop muted></video>

        <!-- UI Slot (paling atas agar selalu terbaca) -->
        <div class="main-container">
            <div class="side-column">
                <div class="box" id="slot-1" data-points="0" data-active="false"></div>
                <div class="box" id="slot-2" data-points="0" data-active="false"></div>
                <div class="box" id="slot-3" data-points="0" data-active="false"></div>
                <div class="box" id="slot-4" data-points="0" data-active="false"></div>
            </div>

            <div class="side-column">
                <div class="box" id="slot-5" data-points="0" data-active="false"></div>
                <div class="box" id="slot-6" data-points="0" data-active="false"></div>
                <div class="box" id="slot-7" data-points="0" data-active="false"></div>
                <div class="box" id="slot-8" data-points="0" data-active="false"></div>
            </div>
        </div>

        <!-- VIDIO ANIMASI: full screen, menumpuk di atas host -->
        <div class="anim-area" id="animArea">
            <video class="anim-video" id="bgVideoLayer" playsinline></video>
            <canvas class="anim-canvas" id="bgCanvasLayer"></canvas>
        </div>
    </div>

    <script>
        for (let i = 1; i <= 8; i++) {
            const box = document.getElementById(`slot-${i}`);
            if (box) {
                box.innerHTML = `
                    <div class="slot-star-number-group" id="slot-star-group-${i}">
                        <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                        <div class="slot-number-text" id="slot-num-${i}">0</div>
                    </div>
                    <div class="slot-top-right-icon" id="slot-top-icon-${i}"><img id="slot-top-img-${i}" src="" alt="gift icon"></div>
                    
                    <div class="slot-content" id="slot-content-${i}">
                        <span class="plus">+</span><span class="label">Permintaan</span>
                    </div>

                    <div class="slot-footer-bar">
                        <div class="slot-name-bottom" id="slot-footer-name-${i}" style="display: none;">
                            <span class="name-text" id="slot-text-name-${i}"></span>
                            <span class="plus-circle-icon">✚</span>
                        </div>
                        <div class="mic-icon-bottom-right" id="slot-mic-${i}"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></div>
                    </div>
                `;
            }
        }

        const channel = new BroadcastChannel('live_control_channel');
        const hostVideo = document.getElementById('hostVideoLayer');
        const bgVideo = document.getElementById('bgVideoLayer');
        const bgCanvas = document.getElementById('bgCanvasLayer');
        const animArea = document.getElementById('animArea');

        /* ================= PENGATURAN =================
           Kedua vidio FULL SCREEN:
           - Vidio host  : latar belakang penuh layar
           - Vidio animasi: menumpuk penuh layar di atas host

           HAPUS_HITAM : true  -> hitam pada vidio animasi jadi TRANSPARAN
                                 (vidio host terlihat di bagian itu),
                                 warna tampil SOLID 100% warna asli
                         false -> vidio animasi menutupi seluruh layar apa adanya

           KEY_LOW / KEY_HIGH : seberapa "gelap" piksel dianggap hitam
                                - masih ada sisa hitam samar?  -> naikkan KEY_HIGH (mis. 0.3)
                                - warna gelap ikut hilang?     -> turunkan keduanya
           HD: canvas dirender pada RESOLUSI ASLI vidio, bukan resolusi layar */
        const HAPUS_HITAM = true;
        const KEY_LOW = 0.05;
        const KEY_HIGH = 0.22;
        /* ============================================== */

        const slotIntervals = {};
        const activeTopIconTimers = {};

        /* ---------- WebGL: hitam -> transparan, warna -> solid asli, resolusi native ---------- */
        let gl = null, glProgram = null, uni = {};
        let bgRAF = null, glBroken = false;
        let hasGL = false;

        if (HAPUS_HITAM) {
            hasGL = initBgKeying();
        }

        function initBgKeying() {
            try {
                gl = bgCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false });
            } catch (e) { gl = null; }
            if (!gl) return false;

            const vsSrc = `
                attribute vec2 a_pos;
                varying vec2 v_uv;
                void main() {
                    v_uv = a_pos * 0.5 + 0.5;
                    gl_Position = vec4(a_pos, 0.0, 1.0);
                }`;

            const fsSrc = `
                precision mediump float;
                varying vec2 v_uv;
                uniform sampler2D u_tex;
                uniform vec2 u_scale;
                uniform vec2 u_offset;
                uniform float u_low;
                uniform float u_high;
                void main() {
                    vec2 uv = u_offset + (v_uv - 0.5) * u_scale;
                    vec4 c = texture2D(u_tex, uv);
                    float lum = max(c.r, max(c.g, c.b));
                    float a = smoothstep(u_low, u_high, lum);
                    gl_FragColor = vec4(c.rgb, a);
                }`;

            function compile(type, src) {
                const sh = gl.createShader(type);
                gl.shaderSource(sh, src);
                gl.compileShader(sh);
                return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
            }

            const vs = compile(gl.VERTEX_SHADER, vsSrc);
            const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
            if (!vs || !fs) return false;

            glProgram = gl.createProgram();
            gl.attachShader(glProgram, vs);
            gl.attachShader(glProgram, fs);
            gl.linkProgram(glProgram);
            if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) return false;
            gl.useProgram(glProgram);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(glProgram, 'a_pos');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

            uni.tex = gl.getUniformLocation(glProgram, 'u_tex');
            uni.scale = gl.getUniformLocation(glProgram, 'u_scale');
            uni.offset = gl.getUniformLocation(glProgram, 'u_offset');
            uni.low = gl.getUniformLocation(glProgram, 'u_low');
            uni.high = gl.getUniformLocation(glProgram, 'u_high');

            gl.uniform1i(uni.tex, 0);
            gl.uniform1f(uni.low, KEY_LOW);
            gl.uniform1f(uni.high, KEY_HIGH);
            gl.uniform2f(uni.scale, 1, 1);
            gl.uniform2f(uni.offset, 0.5, 0.5);

            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.clearColor(0, 0, 0, 0);
            return true;
        }

        /* Crop "cover" dihitung terhadap layar penuh agar vidio mengisi seluruh
           layar tanpa gepeng dan tetap tajam */
        function updateCover() {
            if (!gl || !bgVideo.videoWidth || !bgVideo.videoHeight) return;
            const rect = bgCanvas.getBoundingClientRect();
            const areaAspect = rect.width / Math.max(1, rect.height);
            const videoAspect = bgVideo.videoWidth / bgVideo.videoHeight;
            let sx = 1, sy = 1;
            if (videoAspect > areaAspect) sx = areaAspect / videoAspect;
            else sy = videoAspect / areaAspect;
            gl.uniform2f(uni.scale, sx, sy);
            gl.uniform2f(uni.offset, 0.5, 0.5);
        }

        window.addEventListener('resize', updateCover);

        function renderLoop() {
            bgRAF = requestAnimationFrame(renderLoop);
            if (glBroken || bgVideo.readyState < 2) return;
            try {
                gl.viewport(0, 0, bgCanvas.width, bgCanvas.height);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bgVideo);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            } catch (e) {
                glBroken = true;
                if (bgRAF) { cancelAnimationFrame(bgRAF); bgRAF = null; }
                bgCanvas.style.display = 'none';
                bgVideo.style.display = 'block';
            }
        }

        function showBg() {
            animArea.style.display = 'block';
            if (HAPUS_HITAM && hasGL && !glBroken) {
                bgVideo.style.display = 'none';
                bgCanvas.style.display = 'block';
                if (!bgRAF) renderLoop();
            } else {
                bgCanvas.style.display = 'none';
                bgVideo.style.display = 'block';
            }
        }

        function hideBg() {
            if (bgRAF) { cancelAnimationFrame(bgRAF); bgRAF = null; }
            animArea.style.display = 'none';
            bgCanvas.style.display = 'none';
            bgVideo.style.display = 'none';
        }

        bgVideo.onended = () => {
            hideBg();
            hideAllTopIcons();
        };

        function hideAllTopIcons() {
            for (let i = 1; i <= 8; i++) {
                const iconEl = document.getElementById(`slot-top-icon-${i}`);
                if (iconEl) iconEl.style.display = 'none';
            }
        }

        function scheduleIconHide(slotId) {
            const topIconEl = document.getElementById(`slot-top-icon-${slotId}`);
            if (!topIconEl) return;
            if (activeTopIconTimers[slotId]) clearTimeout(activeTopIconTimers[slotId]);
            const dur = bgVideo.duration;
            if (!isNaN(dur) && dur > 0) {
                activeTopIconTimers[slotId] = setTimeout(() => { topIconEl.style.display = 'none'; }, dur * 1000);
            }
        }

        function parsePointsFromName(filename) {
            if (!filename) return 0;
            const regex = /([\d.,]+)([km])?/i;
            const match = filename.match(regex);
            if (!match) return 0;
            
            let numStr = match[1].replace(/\./g, '').replace(/,/g, '.');
            const modifier = match[2] ? match[2].toLowerCase() : '';
            
            let number = parseFloat(numStr);
            if (isNaN(number)) return 0;

            if (modifier === 'k') number *= 1_000;
            else if (modifier === 'm') number *= 1_000_000;

            return Math.round(number);
        }

        function formatShortName(name) {
            if (!name) return '';
            if (name.length > 10) return name.substring(0, 10) + '...';
            return name;
        }

        function formatPointsDisplay(num) {
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                hostVideo.pause();
                hostVideo.currentTime = 0;
                hostVideo.src = url;
                hostVideo.style.display = 'block';
                hostVideo.load();
                hostVideo.muted = true;
                hostVideo.play().catch(e => console.log("Gagal memutar video host:", e));
            }

            if (type === 'UPDATE_GS_VIDEO') {
                bgVideo.pause();
                bgVideo.currentTime = 0;
                bgVideo.src = url;
                bgVideo.muted = false;

                bgVideo.onloadedmetadata = () => {
                    /* Kunci HD: canvas memakai RESOLUSI ASLI vidio
                       (mis. 1080x1920), lalu diskalakan ke layar -> tajam */
                    if (HAPUS_HITAM && hasGL && !glBroken && bgVideo.videoWidth) {
                        bgCanvas.width = bgVideo.videoWidth;
                        bgCanvas.height = bgVideo.videoHeight;
                        updateCover();
                    }
                    const s = data.slot;
                    if (s && s >= 1 && s <= 8) {
                        const slotEl = document.getElementById(`slot-${s}`);
                        if (slotEl && slotEl.getAttribute('data-active') === 'true' && !activeTopIconTimers[s]) {
                            scheduleIconHide(s);
                        }
                    }
                };

                bgVideo.load();

                const startPlay = () => showBg();
                bgVideo.play().then(startPlay).catch(() => {
                    bgVideo.muted = true;
                    bgVideo.play().then(startPlay).catch(e => console.log('Gagal memutar video animasi:', e));
                });

                const targetSlotId = data.slot;
                if (targetSlotId && targetSlotId >= 1 && targetSlotId <= 8) {
                    const slotEl = document.getElementById(`slot-${targetSlotId}`);
                    if (slotEl && slotEl.getAttribute('data-active') === 'true') {
                        const numberTextEl = document.getElementById(`slot-num-${targetSlotId}`);
                        const starGroupEl = document.getElementById(`slot-star-group-${targetSlotId}`);
                        const topIconEl = document.getElementById(`slot-top-icon-${targetSlotId}`);
                        const topIconImg = document.getElementById(`slot-top-img-${targetSlotId}`);
                        
                        let pointsToAdd = parsePointsFromName(data.name || '');
                        let currentPoints = parseInt(slotEl.getAttribute('data-points') || '0');
                        currentPoints += pointsToAdd;
                        slotEl.setAttribute('data-points', currentPoints);
                        
                        if (numberTextEl) numberTextEl.innerText = formatPointsDisplay(currentPoints);
                        if (starGroupEl) starGroupEl.style.display = 'flex';

                        if (topIconEl && topIconImg) {
                            topIconImg.src = url;
                            topIconEl.style.display = 'flex';
                            scheduleIconHide(targetSlotId);
                        }
                    }
                }
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotId = data.slot;
                if (!slotId || slotId < 1 || slotId > 8) return;
                const slotEl = document.getElementById(`slot-${slotId}`);
                if (!slotEl) return;

                if (slotIntervals[slotId]) {
                    clearInterval(slotIntervals[slotId]);
                    slotIntervals[slotId] = null;
                }

                const contentContainer = document.getElementById(`slot-content-${slotId}`);
                const starGroupEl = document.getElementById(`slot-star-group-${slotId}`);
                const numberTextEl = document.getElementById(`slot-num-${slotId}`);
                const footerNameEl = document.getElementById(`slot-footer-name-${slotId}`);
                const textNameEl = document.getElementById(`slot-text-name-${slotId}`);
                const micIconEl = document.getElementById(`slot-mic-${slotId}`);
                const topIconEl = document.getElementById(`slot-top-icon-${slotId}`);

                if (data.clear) {
                    slotEl.classList.remove('active-slot');
                    slotEl.setAttribute('data-points', '0');
                    slotEl.setAttribute('data-active', 'false');
                    slotEl.style.boxShadow = 'none';

                    if (starGroupEl) starGroupEl.style.display = 'none';
                    if (topIconEl) topIconEl.style.display = 'none';
                    if (footerNameEl) footerNameEl.style.display = 'none';
                    if (micIconEl) micIconEl.style.display = 'none';
                    if (numberTextEl) numberTextEl.innerText = '0';

                    if (contentContainer) {
                        contentContainer.innerHTML = `<span class="plus">+</span><span class="label">Permintaan</span>`;
                    }
                } else {
                    const calculatedPoints = parsePointsFromName(data.name || '');
                    const shortName = formatShortName(data.name || '');

                    slotEl.setAttribute('data-points', calculatedPoints);
                    slotEl.setAttribute('data-active', 'true');
                    slotEl.classList.add('active-slot');

                    if (numberTextEl) numberTextEl.innerText = formatPointsDisplay(calculatedPoints);
                    if (starGroupEl) starGroupEl.style.display = calculatedPoints > 0 ? 'flex' : 'none';

                    if (contentContainer) {
                        contentContainer.innerHTML = `
                            <div class="avatar-container" id="avatarContainer-${slotId}">
                                <img src="${data.photo}" class="slot-avatar" alt="Avatar">
                            </div>
                        `;
                    }

                    if (textNameEl) textNameEl.innerText = shortName;
                    if (footerNameEl) footerNameEl.style.display = 'flex';
                    if (micIconEl) micIconEl.style.display = 'flex';

                    slotIntervals[slotId] = setInterval(() => {
                        slotEl.style.boxShadow = 'inset 0 0 0 3px #1890ff';
                        const avatarContainer = document.getElementById(`avatarContainer-${slotId}`);
                        if (avatarContainer) {
                            avatarContainer.classList.remove('pulsing');
                            void avatarContainer.offsetWidth;
                            avatarContainer.classList.add('pulsing');
                        }
                        setTimeout(() => {
                            slotEl.style.boxShadow = 'inset 0 0 0 0px #1890ff';
                        }, 500);
                    }, 2000);
                }
            }
        };
    </script>
</body>
</html>
